<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="dms-title dms-desc">
  <title id="dms-title">Configuration de Moodle pour Doceria</title>
  <desc id="dms-desc">L'enseignant inscrit le compte de lecture doceria-rag-readonly dans son cours : c'est le consentement (opt-in). Côté Moodle, un compte technique en lecture seule porte un jeton et un rôle dédié ; un service web dédié n'expose qu'une liste blanche de fonctions de contenu. Doceria lit, via le jeton, uniquement les cours consentis et les indexe dans une collection privée interrogeable avec citations. Lecture seule stricte, aucune donnée d'étudiant.</desc>
  <defs>
    <marker id="dms-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A5A55"/></marker>
    <filter id="dms-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#11302E" flood-opacity=".14"/></filter>
    <style>
      .t{font:700 30px Georgia,"Times New Roman",serif;fill:#11302E}
      .sub{font:400 16px Arial,sans-serif;fill:#5F6B64}
      .bt{font:700 21px Arial,sans-serif;fill:#11302E}
      .bx{font:400 15.5px Arial,sans-serif;fill:#4B5751}
      .bxs{font:700 15.5px Arial,sans-serif;fill:#11302E}
      .badge{font:700 12.5px Arial,sans-serif;letter-spacing:.04em}
      .cap{font:400 15px Arial,sans-serif;fill:#5F6B64}
      .lbl{font:600 13px Arial,sans-serif;fill:#1A5A55}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="660" rx="28" fill="#F7F2E7"/>
  <text x="640" y="52" text-anchor="middle" class="t">Comment Moodle est paramétré pour Doceria</text>
  <text x="640" y="82" text-anchor="middle" class="sub">Lecture seule · l'inscription du compte = le consentement de l'enseignant</text>

  <!-- Connecteurs -->
  <line x1="392" y1="330" x2="452" y2="330" stroke="#1A5A55" stroke-width="3.5" stroke-linecap="round" marker-end="url(#dms-ar)"/>
  <text x="422" y="315" text-anchor="middle" class="lbl">accord</text>
  <line x1="828" y1="330" x2="888" y2="330" stroke="#1A5A55" stroke-width="3.5" stroke-linecap="round" marker-end="url(#dms-ar)"/>
  <text x="858" y="315" text-anchor="middle" class="lbl">jeton</text>

  <!-- 1. Enseignant (consentement) -->
  <rect x="56" y="150" width="336" height="360" rx="14" fill="#F2E7CC" stroke="#B68F46" stroke-width="3" filter="url(#dms-sh)"/>
  <text x="224" y="196" text-anchor="middle" class="bt">L'enseignant</text>
  <line x1="86" y1="214" x2="362" y2="214" stroke="#DCCba0" stroke-width="1.5"/>
  <text x="224" y="250" text-anchor="middle" class="bxs">Opt-in par défaut</text>
  <text x="224" y="286" text-anchor="middle" class="bx">Il inscrit le compte de lecture</text>
  <text x="224" y="308" text-anchor="middle" class="bx">de Doceria dans SON cours.</text>
  <text x="224" y="352" text-anchor="middle" class="bxs">Inscription = accord.</text>
  <text x="224" y="392" text-anchor="middle" class="bx">Pas d'inscription →</text>
  <text x="224" y="414" text-anchor="middle" class="bx">cours invisible dans Doceria.</text>
  <text x="224" y="470" text-anchor="middle" class="badge" fill="#8A5A00">☑ CONSENTEMENT</text>

  <!-- 2. Moodle configuré -->
  <rect x="452" y="122" width="376" height="416" rx="14" fill="#E4EFEA" stroke="#1A5A55" stroke-width="3" filter="url(#dms-sh)"/>
  <text x="640" y="166" text-anchor="middle" class="bt">Moodle configuré</text>
  <line x1="482" y1="184" x2="798" y2="184" stroke="#Bcd3ca" stroke-width="1.5"/>
  <g>
    <circle cx="498" cy="218" r="3.5" fill="#1A5A55"/><text x="514" y="223" class="bx">Compte <tspan class="bxs">doceria-rag-readonly</tspan></text>
    <circle cx="498" cy="252" r="3.5" fill="#1A5A55"/><text x="514" y="257" class="bx">Rôle dédié « lecture seule »</text>
    <circle cx="498" cy="286" r="3.5" fill="#1A5A55"/><text x="514" y="291" class="bx">Jeton web-service (révocable)</text>
    <circle cx="498" cy="320" r="3.5" fill="#1A5A55"/><text x="514" y="325" class="bx">Service dédié « Doceria RAG »</text>
    <circle cx="498" cy="354" r="3.5" fill="#1A5A55"/><text x="514" y="359" class="bx">Liste blanche : 8 fonctions</text>
    <text x="514" y="381" class="bx">de <tspan class="bxs">contenu</tspan> (+ 1 pour l'opt-in)</text>
    <circle cx="498" cy="415" r="3.5" fill="#1A5A55"/><text x="514" y="420" class="bx">Cours <tspan class="bxs">consentis</tspan> uniquement</text>
  </g>
  <text x="640" y="500" text-anchor="middle" class="badge" fill="#1A5A55">● LECTURE SEULE</text>

  <!-- 3. Doceria -->
  <rect x="888" y="150" width="336" height="360" rx="14" fill="#F6E4D4" stroke="#CE7A33" stroke-width="3" filter="url(#dms-sh)"/>
  <text x="1056" y="196" text-anchor="middle" class="bt">Doceria</text>
  <line x1="918" y1="214" x2="1194" y2="214" stroke="#e6c9ab" stroke-width="1.5"/>
  <text x="1056" y="252" text-anchor="middle" class="bx">Lit uniquement les cours</text>
  <text x="1056" y="274" text-anchor="middle" class="bx">consentis (via le jeton).</text>
  <text x="1056" y="318" text-anchor="middle" class="bx">Indexe texte + fichiers →</text>
  <text x="1056" y="344" text-anchor="middle" class="bxs">collection privée</text>
  <text x="1056" y="366" text-anchor="middle" class="bxs">« Moodle · &lt;cours&gt; »</text>
  <text x="1056" y="410" text-anchor="middle" class="bx">Interrogeable, avec citations.</text>
  <text x="1056" y="470" text-anchor="middle" class="badge" fill="#CE7A33">◆ RAG PRIVÉ</text>

  <!-- Bandeau bas -->
  <rect x="56" y="556" width="1168" height="60" rx="12" fill="#11302E"/>
  <text x="640" y="593" text-anchor="middle" class="badge" fill="#F4EFE6" style="letter-spacing:.06em;font-size:15px">LECTURE SEULE STRICTE · AUCUNE DONNÉE D'ÉTUDIANT · JETON AU TROUSSEAU · SOUVERAIN</text>
</svg>
