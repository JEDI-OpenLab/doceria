<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="drm-title drm-desc">
  <title id="drm-title">Feuille de route de Doceria</title>
  <desc id="drm-desc">Feuille de route de Doceria en quatre étapes. Aujourd'hui, disponible sur macOS : chat et RAG souverain, comparaison multi-modèles, rendu LaTeX, régénérer/modifier/copier, menu Aide et message de refus. Le connecteur Moodle (RAG sur ses propres cours, en lecture seule et sur consentement) est désormais disponible. En cours : une nouvelle interface macOS, plus soignée. Ensuite : Windows, puis Linux.</desc>
  <defs>
    <marker id="drm-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1A5A55"/></marker>
    <marker id="drm-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B68F46"/></marker>
    <marker id="drm-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9AA39B"/></marker>
    <filter id="drm-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#11302E" flood-opacity=".14"/></filter>
    <style>
      .drm-title{font:700 31px Georgia,"Times New Roman",serif;fill:#11302E}
      .drm-sub{font:400 16px Arial,sans-serif;fill:#5F6B64}
      .drm-bt{font:700 22px Arial,sans-serif;fill:#11302E}
      .drm-bx{font:400 15px Arial,sans-serif;fill:#4B5751}
      .drm-it{font:400 15px Arial,sans-serif;fill:#11302E}
      .drm-badge{font:700 12.5px Arial,sans-serif;letter-spacing:.04em}
      .drm-cap{font:400 15px Arial,sans-serif;fill:#5F6B64}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="560" rx="28" fill="#F7F2E7"/>
  <text x="640" y="54" text-anchor="middle" class="drm-title">Doceria, feuille de route</text>
  <text x="640" y="84" text-anchor="middle" class="drm-sub">Chat, RAG et connecteur Moodle disponibles sur macOS. En cours : une interface repensée. Ensuite : Windows, puis Linux.</text>

  <!-- Connecteurs entre étapes -->
  <line x1="328" y1="215" x2="352" y2="215" stroke="#1A5A55" stroke-width="3.5" stroke-linecap="round" marker-end="url(#drm-petrol)"/>
  <line x1="628" y1="215" x2="652" y2="215" stroke="#B68F46" stroke-width="3.5" stroke-linecap="round" marker-end="url(#drm-gold)"/>
  <line x1="928" y1="215" x2="952" y2="215" stroke="#9AA39B" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#drm-muted)"/>

  <!-- B1 Aujourd'hui (carte détaillée, disponible) -->
  <rect x="56" y="150" width="268" height="300" rx="12" fill="#E4EFEA" stroke="#1A5A55" stroke-width="3" filter="url(#drm-shadow)"/>
  <text x="190" y="190" text-anchor="middle" class="drm-bt">Aujourd'hui</text>
  <text x="190" y="216" text-anchor="middle" class="drm-bx">macOS Apple Silicon</text>
  <line x1="80" y1="232" x2="300" y2="232" stroke="#C9C0AC" stroke-width="1.5"/>
  <g>
    <circle cx="74" cy="257" r="3" fill="#1A5A55"/><text x="90" y="262" class="drm-it">Chat + RAG souverain</text>
    <circle cx="74" cy="285" r="3" fill="#1A5A55"/><text x="90" y="290" class="drm-it">Comparaison multi-modèles</text>
    <circle cx="74" cy="313" r="3" fill="#1A5A55"/><text x="90" y="318" class="drm-it">Rendu LaTeX / formules</text>
    <circle cx="74" cy="341" r="3" fill="#1A5A55"/><text x="90" y="346" class="drm-it">Régénérer · Modifier · Copier</text>
    <circle cx="74" cy="369" r="3" fill="#1A5A55"/><text x="90" y="374" class="drm-it">Menu Aide · message de refus</text>
  </g>
  <text x="190" y="424" text-anchor="middle" class="drm-badge" fill="#1A5A55">● DISPONIBLE</text>

  <!-- B2 Moodle (disponible, le différenciateur) -->
  <rect x="356" y="150" width="268" height="140" rx="12" fill="#E4EFEA" stroke="#1A5A55" stroke-width="3" filter="url(#drm-shadow)"/>
  <text x="490" y="192" text-anchor="middle" class="drm-bt">Moodle</text>
  <text x="490" y="220" text-anchor="middle" class="drm-bx">vos cours dans votre RAG</text>
  <text x="490" y="241" text-anchor="middle" class="drm-bx">lecture seule, sur consentement</text>
  <text x="490" y="270" text-anchor="middle" class="drm-badge" fill="#1A5A55">● DISPONIBLE · le différenciateur</text>

  <!-- B3 Nouvelle interface (en cours) -->
  <rect x="656" y="150" width="268" height="140" rx="12" fill="#F2E7CC" stroke="#B68F46" stroke-width="3" filter="url(#drm-shadow)"/>
  <text x="790" y="192" text-anchor="middle" class="drm-bt">Nouvelle interface</text>
  <text x="790" y="220" text-anchor="middle" class="drm-bx">une app macOS repensée,</text>
  <text x="790" y="241" text-anchor="middle" class="drm-bx">plus soignée que jamais</text>
  <text x="790" y="270" text-anchor="middle" class="drm-badge" fill="#B68F46">◑ EN COURS</text>

  <!-- B4 Windows & Linux (ensuite) -->
  <rect x="956" y="150" width="268" height="140" rx="12" fill="#F6E4D4" stroke="#CE7A33" stroke-width="3" filter="url(#drm-shadow)"/>
  <text x="1090" y="192" text-anchor="middle" class="drm-bt">Windows &amp; Linux</text>
  <text x="1090" y="220" text-anchor="middle" class="drm-bx">le gros du parc ESR</text>
  <text x="1090" y="241" text-anchor="middle" class="drm-bx">.exe signé + .AppImage</text>
  <text x="1090" y="270" text-anchor="middle" class="drm-badge" fill="#CE7A33">○ ENSUITE</text>

  <!-- Légende bas -->
  <text x="640" y="492" text-anchor="middle" class="drm-cap">Le connecteur Moodle est là, c'est notre différenciateur. En chantier : une interface repensée.</text>
  <text x="640" y="516" text-anchor="middle" class="drm-cap">Ensuite Windows et Linux. Toujours souverain, simple, en français.</text>
</svg>
